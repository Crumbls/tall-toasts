name: run-checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, mbstring, zip, pdo_sqlite, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Psalm
        run: vendor/bin/psalm --output-format=github

      - name: PHPStan
        run: vendor/bin/phpstan

      - name: PHP MessDetector
        run: vendor/bin/phpmd src github phpmd-ruleset.xml.dist

      - name: PHP Code Sniffer
        run: vendor/bin/phpcs

  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['^10.0', '^11.0', '^12.0', '^13.0']
        livewire: ['^3.0', '^4.0']
        include:
          - laravel: '^10.0'
            testbench: '^8.23.2'
          - laravel: '^11.0'
            testbench: '^9.0'
          - laravel: '^12.0'
            testbench: '^10.0'
          - laravel: '^13.0'
            testbench: '^11.0'
        exclude:
          - php: '8.4'
            laravel: '^10.0'
          - php: '8.5'
            laravel: '^10.0'
          - php: '8.5'
            laravel: '^11.0'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Livewire ${{ matrix.livewire }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pcntl, pdo_sqlite, bcmath, intl
          tools: composer:v2
          coverage: xdebug

      - name: Install Composer dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer require "livewire/livewire:${{ matrix.livewire }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute Tests + Coverage
        run: vendor/bin/pest --parallel --coverage-clover=build/clover.xml
        env:
          RUNNING_IN_CI: true

      - name: Upload Coverage
        if: github.event_name == 'push' && matrix.php == '8.4' && matrix.laravel == '^13.0' && matrix.livewire == '^4.0'
        uses: codacy/codacy-coverage-reporter-action@v1.3
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/clover.xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.php == '8.4' && matrix.laravel == '^13.0' && matrix.livewire == '^4.0'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./build/
